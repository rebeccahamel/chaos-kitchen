title: Sommerrollen mit Erdnusssauce
description: Frische Reispapierrollen zum Selberrollen am Tisch, mit Glasnudeln, Möhren, Sprossen, Kräutern, Hähnchen, Steak, knusprigem Tofu und Shiitake. Was übrig bleibt, wird am nächsten Tag ein lauwarmer Glasnudelsalat.
author: becci
added: 2026-09-23
yield: { amount: 4, unit: Portionen }
time: { prep: 35, cook: 15 }
tags: [abendessen, mittagessen, fleisch, asiatisch, sommer]

ingredients:
  - group: Für die Füllung
    items:
      - { id: reispapier, amount: 16, unit: Blatt, name: Reispapier }
      - { id: glasnudeln, amount: 75, unit: g, name: Glasnudeln }
      - { id: moehren, amount: 2, name: Möhre, plural: Möhren }
      - { id: sprossen, amount: 75, unit: g, name: Mungobohnensprossen }
      - { id: minze, amount: 1, unit: Bund, name: Minze }
      - { id: koriander, amount: 1, unit: Bund, name: Koriander }
      - { id: salat, amount: 4, unit: Blätter, name: Kopfsalat, plural: Kopfsalate, note: kleine Blätter zum Einrollen, optional: true }
      - { id: mango, amount: 0.5, name: Mango, plural: Mangos, note: reif, optional: true }
  - group: Für Hähnchen und Steak
    items:
      - { id: haehnchen, amount: 200, unit: g, name: Hähnchenbrust }
      - { id: steak, amount: 200, unit: g, name: Rindersteak, note: z. B. Hüfte oder Rumpsteak }
      - { id: ingwer, amount: 1, unit: Stück, name: Ingwer, note: daumengroß }
      - { id: knoblauch, amount: 2, unit: Zehen, name: Knoblauch }
      - { id: sojasauce-marinade, amount: 2, unit: EL, name: Sojasauce }
      - { id: sesamoel, amount: 1, unit: EL, name: Sesamöl }
      - { id: oel, amount: 2, unit: EL, name: Öl, note: neutral zum Braten }
  - group: Für den Tofu
    items:
      - { id: tofu, amount: 200, unit: g, name: Tofu, note: fest }
      - { id: sojasauce-tofu, amount: 2, unit: EL, name: Sojasauce }
      - { id: reisessig-tofu, amount: 1, unit: EL, name: Reisessig }
      - { id: zucker-tofu, amount: 1, unit: TL, name: Zucker }
  - group: Für die Shiitake
    items:
      - { id: shiitake, amount: 20, unit: g, name: Shiitake, note: getrocknet }
      - { id: sojasauce-shiitake, amount: 1, unit: EL, name: Sojasauce }
      - { id: mirin, amount: 1, unit: EL, name: Mirin }
      - { id: reisessig-shiitake, amount: 1, unit: TL, name: Reisessig }
  - group: Für die Erdnusssauce
    items:
      - { id: erdnussbutter, amount: 4, unit: EL, name: Erdnussbutter }
      - { id: sojasauce-sauce, amount: 2, unit: EL, name: Sojasauce }
      - { id: knoblauch-sauce, amount: 1, unit: Zehe, name: Knoblauch }
      - { id: wasser, amount: 60, unit: ml, name: Wasser, note: warm }
      - { id: sriracha, name: Sriracha, note: nach Geschmack, optional: true }
  - group: Für den nächsten Tag (lauwarmer Glasnudelsalat)
    items:
      - { id: limette-dressing, amount: 1, name: Limette, plural: Limetten }
      - { id: sojasauce-dressing, amount: 2, unit: EL, name: Sojasauce }
      - { id: sesamoel-dressing, amount: 1, unit: EL, name: Sesamöl }
      - { id: honig-dressing, amount: 1, unit: TL, name: Honig }
      - { id: chili, amount: 1, name: rote Chili, plural: rote Chilis, optional: true }
      - { id: erdnuesse, amount: 40, unit: g, name: Erdnüsse, note: geröstet und gesalzen }
      - { id: glasnudeln-salat, amount: 50, unit: g, name: Glasnudeln, note: falls keine übrig sind, optional: true }

steps:
  - group: Vorbereitung
    items:
      - "{shiitake} in einer Schüssel mit kochend heißem Wasser übergießen und 10 Minuten einweichen. Abgießen und das Pilzwasser aufheben: Eingefroren ist es die Basis für eine Pilzrahmsuppe. Die harten Stiele entfernen, die Hüte in Streifen schneiden. {sojasauce-shiitake}, {mirin} und {reisessig-shiitake} verrühren, über die Pilze geben und ziehen lassen."
      - "{ingwer} und {knoblauch} fein reiben und mit {sojasauce-marinade} und {sesamoel} verrühren. {haehnchen} und {steak} im Ganzen darin 10 Minuten ziehen lassen. Das Fleisch wird erst nach dem Braten geschnitten."
      - "{glasnudeln} nach Packungsanweisung in heißem Wasser einweichen (meist 5 Minuten), abgießen, kalt abschrecken und mit der Küchenschere etwas kürzer schneiden."
      - "In der Zwischenzeit {moehren} schälen und in feine Streifen hobeln oder schneiden, {sprossen} waschen, {minze} und {koriander} zupfen, den {salat:name} in kleine Blätter teilen. Die {mango:name} schälen und in Streifen schneiden. Alles in Schälchen auf den Tisch stellen."
      - "{oel:1/2} in einer Pfanne stark erhitzen. Das Hähnchen im Ganzen 5–6 Minuten pro Seite braten (eine dicke Brust vorher waagerecht halbieren), das Steak 2–3 Minuten pro Seite. Beides auf einem Brett 5 Minuten ruhen lassen und erst dann quer zur Faser in Streifen schneiden, so bleibt das Fleisch saftig."
      - "{tofu} trocken tupfen und in Streifen schneiden. Das restliche Öl ({oel:1/2}) in der Pfanne bei mittlerer bis hoher Hitze erhitzen und den Tofu rundum knusprig braten. {sojasauce-tofu}, {reisessig-tofu} und {zucker-tofu} verrühren, in die Pfanne gießen und unter Schwenken in etwa einer Minute einkochen, bis der Tofu glasiert ist. So bleibt er knusprig."
      - "Die Shiitake mit ihrer Marinade in die Pfanne geben und 2–3 Minuten braten, bis die Flüssigkeit verdampft ist. Alles warm halten."
  - group: Erdnusssauce
    items:
      - "{erdnussbutter}, {sojasauce-sauce} und den fein geriebenen {knoblauch-sauce:name} verrühren. Nach und nach {wasser} zugeben, bis die Sauce dickflüssig, aber löffelbar ist. {sriracha} extra dazustellen, dann bleiben die Rollen für die Kleine mild."
  - group: Rollen
    items:
      - "Eine große Schüssel mit lauwarmem Wasser auf den Tisch stellen. Je ein Blatt {reispapier:name} 5–10 Sekunden eintauchen, auf einen feuchten Teller legen und kurz warten, bis es weich wird. Insgesamt werden etwa {reispapier} gebraucht."
      - "Ins untere Drittel ein Salatblatt legen, darauf Glasnudeln, Möhren, Sprossen, Kräuter, Mango und Protein nach Wahl, nicht zu viel. Seiten einklappen und straff aufrollen. Jeder rollt selbst und dippt in die Erdnusssauce."
  - group: Für den nächsten Tag (lauwarmer Glasnudelsalat)
    items:
      - "Übrig gebliebene Glasnudeln, Gemüse, Kräuter und Proteine in eine große Schüssel geben. Falls Nudeln fehlen, {glasnudeln-salat} einweichen. Die Proteine in einer Pfanne kurz anwärmen, damit der Salat lauwarm wird."
      - "Für das Dressing den Saft der {limette-dressing} mit {sojasauce-dressing}, {sesamoel-dressing} und {honig-dressing} verrühren. Die restliche {minze:name} fein hacken, die {chili:name} in feine Ringe schneiden, beides unterrühren."
      - "Das Dressing über den Salat geben, gut vermengen und mit {erdnuesse} bestreuen. Reste der Erdnusssauce passen ebenfalls dazu."

title: Cremige Lachs-Pasta mit Kirschtomaten und Spinat
description: Kurze Nudeln in einer leichten Sauce aus Crème fraîche, aufgeplatzten Kirschtomaten und Zitrone, mit zartem Lachs, Babyspinat und Parmesan. Eine Pfanne, ein Topf, in 30 Minuten fertig.
author: becci
added: 2026-11-02
trial: true
yield: { amount: 4, unit: Portionen }
time: { prep: 10, cook: 20 }
tags: [abendessen, mittagessen, fisch, italienisch]

ingredients:
  - { id: nudeln, amount: 350, unit: g, name: Nudeln, note: "kurze Form, z. B. Penne" }
  - { id: lachs, amount: 400, unit: g, name: Lachsfilet, note: ohne Haut }
  - { id: kirschtomaten, amount: 200, unit: g, name: Kirschtomaten }
  - { id: spinat, amount: 100, unit: g, name: Babyspinat }
  - { id: zwiebel, amount: 1, name: Zwiebel, plural: Zwiebeln }
  - { id: knoblauch, amount: 2, unit: Zehe, name: Knoblauch }
  - { id: olivenoel, amount: 1, unit: EL, name: Olivenöl }
  - { id: creme, amount: 150, unit: g, name: Crème fraîche }
  - { id: zitrone, amount: 1, name: Zitrone, plural: Zitronen, note: Bio }
  - { id: parmesan, amount: 40, unit: g, name: Parmesan, note: am Stück }
  - { id: salz, name: Salz }
  - { id: pfeffer, name: Pfeffer }

steps:
  - "Einen großen Topf Salzwasser für die Nudeln aufsetzen. {zwiebel} fein würfeln, {knoblauch} in feine Scheiben schneiden, {kirschtomaten} halbieren. {lachs} trocken tupfen, in etwa 3 cm große Würfel schneiden und leicht salzen."
  - "{nudeln} ins kochende Wasser geben und bissfest kochen. Vor dem Abgießen eine Tasse Kochwasser auffangen."
  - "{olivenoel} in einer großen, tiefen Pfanne erhitzen und die Lachswürfel bei mittlerer Hitze rundum 3–4 Minuten braten, bis sie gerade eben durch sind. Herausnehmen."
  - "Zwiebel und Knoblauch im Bratfett 2 Minuten andünsten. Die Tomaten zugeben und 3–4 Minuten braten, bis sie weich werden und aufplatzen. {creme} und etwa 100 ml Kochwasser einrühren und kurz aufkochen."
  - "{zitrone} heiß waschen, die Schale fein abreiben und den Saft auspressen. {parmesan} reiben. Die abgetropften Nudeln und {spinat} in die Sauce geben und schwenken, bis der Spinat zusammenfällt. Zitronenschale, die Hälfte vom Saft und die Hälfte vom Parmesan unterrühren."
  - "Den Lachs in groben Stücken unterheben und mit {salz:name}, {pfeffer:name} und dem restlichen Zitronensaft abschmecken; wenn nötig mit etwas Kochwasser cremig rühren. Mit dem restlichen Parmesan servieren."

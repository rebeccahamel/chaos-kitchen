title: Schweinelachssteaks mit Kräuterbutter, Ofenkartoffeln und Tomaten-Bohnen
description: Saftig gebratene Schweinelachssteaks mit selbst gerührter Petersilien-Thymian-Butter, dazu gewürzte Kartoffeln aus dem Ofen und grüne Bohnen mit Tomate und Knoblauch. Nach einem HelloFresh-Rezept.
author: becci
added: 2026-10-05
trial: true
yield: { amount: 4, unit: Portionen }
time: { prep: 15, cook: 30 }
tags: [abendessen, fleisch]

ingredients:
  - group: Für die Ofenkartoffeln
    items:
      - { id: kartoffeln, amount: 1.2, unit: kg, name: Kartoffeln, note: Drillinge }
      - { id: paprikapulver, amount: 2, unit: TL, name: Paprikapulver, note: edelsüß }
      - { id: kurkuma, amount: 0.5, unit: TL, name: Kurkuma, note: gemahlen }
      - { id: oel, amount: 6, unit: EL, name: Öl }
  - group: Für Steaks und Kräuterbutter
    items:
      - { id: steaks, amount: 500, unit: g, name: Schweinelachssteaks }
      - { id: butter, amount: 90, unit: g, name: Butter, note: weich }
      - { id: petersilie, amount: 0.5, unit: Bund, name: Petersilie, note: glatt }
      - { id: thymian, amount: 3, unit: Zweig, name: Thymian }
      - { id: salz, name: Salz }
      - { id: pfeffer, name: Pfeffer }
  - group: Für die Bohnen
    items:
      - { id: bohnen, amount: 400, unit: g, name: grüne Bohnen }
      - { id: tomate, amount: 2, name: Tomate, plural: Tomaten }
      - { id: knoblauch, amount: 2, unit: Zehe, name: Knoblauch }

steps:
  - "Den Backofen auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen. {kartoffeln} waschen und vierteln. {paprikapulver}, {kurkuma} und {oel:1/3} dazugeben, salzen und vermengen. Auf einem Blech mit Backpapier verteilen und 25–30 Minuten goldbraun backen."
  - "{bohnen} putzen und quer halbieren. In Salzwasser 8–9 Minuten bissfest kochen, abgießen und kalt abspülen."
  - "{thymian} abzupfen, {petersilie} dazugeben und beides zusammen fein hacken. {butter} mit der Hälfte der Kräuter mischen und mit etwas Salz und Pfeffer würzen. {knoblauch} schälen, {tomate} in 2 cm große Würfel schneiden."
  - "{steaks} von beiden Seiten salzen und pfeffern. {oel:1/3} in einer großen Pfanne erhitzen und die Steaks bei mittlerer Hitze je Seite 3–5 Minuten braten, bis sie in der Mitte nur noch ganz leicht rosa sind."
  - "Das restliche Öl ({oel:1/3}) im Bohnentopf bei mittlerer Hitze erhitzen und die Bohnen 2 Minuten anbraten. Den Knoblauch dazupressen und 1 Minute mitbraten, dann die Tomatenwürfel 1 Minute mitbraten. Die restlichen Kräuter unterrühren und mit {salz:name} und {pfeffer:name} würzen."
  - "Kartoffeln, Bohnen und Steaks anrichten und die Kräuterbutter auf den Steaks verteilen."

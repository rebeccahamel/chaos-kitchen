title: Orangen-Tofu mit Paprikagemüse und Reis
description: Knusprig gebratene Tofuwürfel in einer süß-salzigen Soße aus frischem Orangensaft, Sojasauce und Knoblauch, dazu gebratene Paprika, Basmatireis und gerösteter Sesam. Nach einem HelloFresh-Rezept.
author: becci
added: 2026-10-05
trial: true
yield: { amount: 4, unit: Portionen }
time: { prep: 15, cook: 20 }
tags: [abendessen, mittagessen, vegan, asiatisch]

ingredients:
  - group: Für den Reis
    items:
      - { id: reis, amount: 300, unit: g, name: Basmatireis }
      - { id: wasser-reis, amount: 600, unit: ml, name: Wasser }
  - group: Für Tofu und Soße
    items:
      - { id: tofu, amount: 500, unit: g, name: Tofu, note: "fest, gern mit Basilikum" }
      - { id: orange, amount: 4, name: Orange, plural: Orangen }
      - { id: sojasauce, amount: 7, unit: EL, name: Sojasauce }
      - { id: zucker, amount: 2, unit: TL, name: Zucker }
      - { id: staerke, amount: 2, unit: EL, name: Speisestärke }
      - { id: knoblauch, amount: 4, unit: Zehe, name: Knoblauch }
      - { id: sesam, amount: 20, unit: g, name: Sesam }
      - { id: oel, amount: 4, unit: EL, name: Öl }
      - { id: pfeffer, name: Pfeffer }
  - group: Für das Paprikagemüse
    items:
      - { id: paprika, amount: 4, name: Paprika, plural: Paprika }
      - { id: zwiebel, amount: 1, name: Zwiebel, plural: Zwiebeln }
      - { id: wasser-gemuese, amount: 100, unit: ml, name: Wasser }
      - { id: schnittlauch, amount: 0.5, unit: Bund, name: Schnittlauch }

steps:
  - "{wasser-reis} mit etwas Salz in einem kleinen Topf aufkochen. {reis} dazugeben und zugedeckt bei niedriger Hitze 10 Minuten köcheln lassen, dann vom Herd nehmen und zugedeckt 10 Minuten ziehen lassen."
  - "{tofu} mit Küchenpapier trocken tupfen und dabei etwas Wasser herausdrücken, dann in 1 cm große Würfel schneiden. {paprika} entkernen und in 1 cm breite Streifen schneiden. {zwiebel} fein würfeln, {knoblauch} fein hacken, {schnittlauch} in feine Röllchen schneiden."
  - "{orange} auspressen. {sojasauce}, {zucker}, {staerke} und die Hälfte vom Knoblauch zum Saft geben und glatt rühren."
  - "{sesam} in einer großen Pfanne ohne Fett 1–2 Minuten rösten, bis er bräunt, und herausnehmen. {oel:1/2} in der Pfanne erhitzen und die Tofuwürfel bei mittlerer Hitze unter häufigem Rühren 6–8 Minuten knusprig braten. Die Hitze reduzieren, mit der Soße ablöschen, 1–2 Minuten köcheln lassen und mit {pfeffer:name} abschmecken."
  - "In einer zweiten Pfanne das restliche Öl ({oel:1/2}) erhitzen und Paprika und Zwiebeln 2–3 Minuten anbraten. {wasser-gemuese} und den restlichen Knoblauch dazugeben und braten, bis das Wasser verdampft ist."
  - "Den Reis mit Tofu und Paprikagemüse anrichten und mit Sesam und Schnittlauch bestreuen. Für die Kleine nur wenig Soße nehmen, sie ist durch die Sojasauce salzig."

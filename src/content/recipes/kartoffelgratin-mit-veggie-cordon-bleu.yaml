title: Kartoffelgratin mit Veggie-Cordon-bleu
description: Cremiges Kartoffelgratin mit Bergkäse, dazu Veggie-Cordon-bleu aus dem Ofen und ein grüner Salat mit Radieschen. Die Kartoffeln köcheln kurz in der Sahne vor, dann geht es im Ofen schneller.
author: becci
added: 2026-09-23
yield: { amount: 4, unit: Portionen }
time: { prep: 15, cook: 40 }
tags: [abendessen, vegetarisch, herbst]

ingredients:
  - group: Für das Gratin
    items:
      - { id: kartoffeln, amount: 1, unit: kg, name: Kartoffeln, note: festkochend }
      - { id: sahne, amount: 250, unit: ml, name: Sahne }
      - { id: milch, amount: 250, unit: ml, name: Milch }
      - { id: knoblauch, amount: 1, unit: Zehe, name: Knoblauch }
      - { id: gratinkaese, amount: 150, unit: g, name: Gratinkäse, note: gerieben }
      - { id: muskat, name: Muskatnuss, note: frisch gerieben }
      - { id: rosmarin, amount: 3, unit: Zweige, name: Rosmarin, note: frisch }
      - { id: salz, name: Salz }
      - { id: pfeffer, name: Pfeffer }
  - group: Außerdem
    items:
      - { id: cordon-bleu, amount: 4, unit: Stück, name: Veggie-Cordon-bleu }
  - group: Für den Salat
    items:
      - { id: kopfsalat, amount: 1, name: Kopfsalat, plural: Kopfsalate }
      - { id: radieschen, amount: 1, unit: Bund, name: Radieschen }
      - { id: schnittlauch, amount: 0.5, unit: Bund, name: Schnittlauch }
      - { id: senf, amount: 1, unit: TL, name: Senf }
      - { id: essig, amount: 2, unit: EL, name: Weißweinessig }
      - { id: honig, amount: 1, unit: TL, name: Honig }
      - { id: oel, amount: 4, unit: EL, name: Olivenöl }

steps:
  - "{kartoffeln} schälen und in dünne Scheiben hobeln, etwa 2–3 mm."
  - "{knoblauch} fein hacken oder pressen. {rosmarin} waschen, die Blätter abstreifen und fein hacken. Beides zusammen mit {sahne} und {milch} in einem Messbecher vermischen, und mit {salz:name}, {pfeffer:name} und {muskat} kräftig würzen."
  - " Nun den Backofen auf 200 °C Ober-/Unterhitze vorheizen. Die Kartoffelscheiben in einen Topf geben und mit der Milch-Sahne-Mischung übergießen. Bei mittelhoher Hitze aufkochen und 8–10 Minuten leise köcheln lassen, bis die Kartoffeln fast gar sind."
  - "Alles in die Auflaufform geben, glatt streichen, mit {gratinkaese} bestreuen und 20-25 Minuten backen, bis die Oberfläche goldbraun ist."
  - "{cordon-bleu} nach Packungsanweisung in der Pfanne oder Heißluftfritteuse zubereiten, meist 6-8 Minuten."
  - "Für den Salat den {kopfsalat:name} waschen und zupfen, {radieschen} in Scheiben schneiden, {schnittlauch} in Röllchen. {senf}, {essig}, {honig}, Salz und Pfeffer verrühren, {oel} unterschlagen und erst kurz vor dem Servieren mit dem Salat mischen."
  - "Gratin und Cordon bleu mit dem Salat servieren."

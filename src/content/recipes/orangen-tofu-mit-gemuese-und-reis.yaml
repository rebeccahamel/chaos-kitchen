title: Orangen-Tofu mit Gemüse und Reis
description: Knusprig gebratene Tofuwürfel in einer süß-salzigen Soße aus frischem Orangensaft, Sojasauce und Knoblauch, dazu Gemüse, Basmatireis und gerösteter Sesam. Nach einem HelloFresh-Rezept.
author: becci
added: 2026-10-05
yield: { amount: 4, unit: Portionen }
time: { prep: 15, cook: 20 }
tags: [abendessen, mittagessen, vegan, asiatisch]

ingredients:
  - { id: reis, amount: 300, unit: g, name: Basmatireis }
  - { id: tofu, amount: 500, unit: g, name: Tofu, note: "fest" }
  - { id: orange, amount: 4, name: Orange, plural: Orangen }
  - { id: sojasauce, amount: 7, unit: EL, name: Sojasauce }
  - { id: zucker, amount: 2, unit: TL, name: Zucker }
  - { id: staerke, amount: 2, unit: EL, name: Speisestärke }
  - { id: knoblauch, amount: 3, unit: Zehe, name: Knoblauch }
  - { id: sesam, amount: 20, unit: g, name: Sesam }
  - { id: oel, amount: 4, unit: EL, name: Öl }
  - { id: pfeffer, name: Pfeffer }
  - { id: paprika, amount: 2, name: Paprika, plural: Paprika }
  - { id: brokkoli, amount: 0.5, name: Brokkoli, plural: Brokkoli }
  - { id: zwiebel, amount: 1, name: Zwiebel, plural: Zwiebeln }

steps:
  - "{reis} wie gewohnt zubereiten."
  - "{tofu} mit Küchenpapier trocken tupfen und dabei etwas Wasser herausdrücken, dann in 1 cm große Würfel schneiden. {paprika} und {brokkoli} waschen, putzen und in mundgerechte Stücke schneiden. {zwiebel} fein würfeln, {knoblauch} fein hacken oder pressen."
  - "{orange} auspressen. Saft mit {sojasauce}, {zucker}, {staerke} und Knoblauch glatt rühren."
  - "{sesam} in einer großen Pfanne ohne Fett 1–2 Minuten rösten, bis er bräunt, und herausnehmen. {oel} in der Pfanne erhitzen und die Tofuwürfel mit den Zwiebeln bei mittlerer Hitze unter häufigem Rühren 6–8 Minuten anbraten. Mit der Soße ablöschen, Paprika und Brokkoli hinzufügen und 5 Minuten köcheln lassen, bis das Gemüse gar, aber noch bissfest ist. Mit {pfeffer:name} abschmecken."
  - "Den Reis mit der Tofu-Gemüse-Sauce anrichten und mit Sesam bestreuen."

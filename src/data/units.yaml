# Allowed units. Recipes may use the singular or the plural form; both resolve to the same entry.
# category decides the rounding when a recipe is scaled (SPEC.md §5.1):
#   weight, volume  -> steps of 1 / 5 / 10, from 1000 shown as kg / l
#   spoon           -> quarters (¼, ½, ¾)
#   count           -> halves (½), below 1 eighths (⅛)
# bring: compound  -> on the Bring! shopping list the unit is glued onto the name, because Bring!
#                      does not know these units: "3 Knoblauchzehen" instead of "3 Zehen Knoblauch".
# bring: note      -> amount and unit go into Bring!'s specification field instead:
#                      "Porree, 2 Stangen" (the site itself still shows "2 Stangen Porree").
- { unit: g,        plural: g,         category: weight }
- { unit: kg,       plural: kg,        category: weight }
- { unit: ml,       plural: ml,        category: volume }
- { unit: l,        plural: l,         category: volume }
- { unit: EL,       plural: EL,        category: spoon }
- { unit: TL,       plural: TL,        category: spoon }
- { unit: Tasse,    plural: Tassen,    category: spoon }
- { unit: Prise,    plural: Prisen,    category: count }
- { unit: Dose,     plural: Dosen,     category: count }
- { unit: Päckchen, plural: Päckchen,  category: count }
- { unit: Bund,     plural: Bund,      category: count }
- { unit: Zehe,     plural: Zehen,     category: count, bring: compound }
- { unit: Scheibe,  plural: Scheiben,  category: count }
- { unit: Stange,   plural: Stangen,   category: count, bring: note }
- { unit: Stück,    plural: Stück,     category: count }
- { unit: Portion,  plural: Portionen, category: count }
- { unit: Blech,    plural: Bleche,    category: count }
- { unit: Blatt,    plural: Blätter,   category: count }
- { unit: Zweig,    plural: Zweige,    category: count }

# Wochenplan (MEAL_PLANNER.md §11, SPEC.md §6.9). Shown on the homepage as "Diese Woche" and
# "Nächste Woche"; with an empty weeks list the section is hidden. Claude Code writes this file
# in the weekly planning session: the new week is added at the end, a finished week is removed.
#
# weeks holds at most two weeks in date order, each with an optional note and its days.
# Each day has a date and optionally a lunch and a dinner. A meal is one of:
#   { recipe: <slug> }          a recipe of the site, at most once per week (max. 10 recipes)
#   { leftovers: <date> }       leftovers from an earlier day of the same week
#   { text: "…" }               anything else, without a link ("Brot mit Salat", "Essen gehen")
# A day without lunch and dinner is a free day.

weeks:
  - note: Fünf neue Rezepte zum Ausprobieren. Montag, Dienstag und Donnerstag geht es schnell, Mittwoch gibt es Dal, das sich gut verdoppeln und einfrieren lässt, und die Reste sind meist das Mittagessen danach.
    days:
      - date: 2026-10-05
        lunch: { text: "Reste vom Sonntag: cremige Pasta" }
        dinner: { recipe: haehnchenschenkel-mit-rosenkohl-pfannensauce-und-parmesan-polenta }
      - date: 2026-10-06
        lunch: { leftovers: 2026-10-05 }
        dinner: { text: "Ofen-Feta mit Kirschtomaten, weißen Bohnen und Spinat" }
      - date: 2026-10-07
        lunch: { text: "Reste vom Ofen-Feta mit Kirschtomaten, weißen Bohnen und Spinat" }
        dinner: { recipe: mildes-linsen-moehren-dal-mit-reis }
      - date: 2026-10-08
        lunch: { leftovers: 2026-10-07 }
        dinner: { recipe: schupfnudel-pfanne-mit-porree-apfel-und-speck }
      - date: 2026-10-09
        lunch: { text: "Brote mit Radieschenquark und Ei, dazu Feldsalat" }
        dinner: { recipe: kuerbisrisotto-mit-salbei }

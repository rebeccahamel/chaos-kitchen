# Wochenplan (MEAL_PLANNER.md §14). Shown on the homepage as "Diese Woche"; with an empty
# days list the section is hidden. Claude Code writes this file in the weekly planning session.
#
# Each day has a date and optionally a lunch and a dinner. A meal is one of:
#   { recipe: <slug> }          a recipe of the site, at most once per week (max. 10 recipes)
#   { leftovers: <date> }       leftovers from an earlier day of this plan
#   { text: "…" }               anything else, without a link ("Brot mit Salat", "Essen gehen")
# A day without lunch and dinner is a free day.
#
# Example:
# note: Diese Woche mit viel Gemüse.
# days:
#   - date: 2026-09-28
#     lunch: { text: "Brot mit Salat" }
#     dinner: { recipe: fischcurry-mit-reis }
#   - date: 2026-09-29
#     lunch: { leftovers: 2026-09-28 }
#     dinner: { recipe: hackbaellchen-tomcana }
#   - date: 2026-09-30

days: []
